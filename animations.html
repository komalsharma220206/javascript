<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            background-color: azure;
            height: 80vh;
            width:30vw;
        }
        .box{
           width:35px;
           height:45px;
           background-color: rgb(115, 115, 214);
           animation: komalkaanimation 2s ease-in-out 1s 1 forwards;
        }
        .box1{
            background-color: fuchsia;
            border: 2px solid black;
            border-radius: 50px;
            width:10px;
            height:50px;
            box-sizing: border-box;
            margin:40px;
            animation: harry 0.5s ease-in-out  infinite ;
        }
        @keyframes komalkaanimation {
            from{
                background-color: chocolate;

            }
            to{
                transform: translateX(100px);
                background-color: coral;
            }
        }
        @keyframes harry{
            0%{
               transform: rotate(100deg);
               transform: translateX(20px) ;
            }
            20%{
                transform: rotate(200deg);
                transform: translateX(20px) ;
            }
            40%{
                transform: rotate(300deg);
                transform: translateX(20px) ;
            }
            60%{
                transform: rotate(400deg);
                transform: translateX(20px) ;
            }
            80%{
                transform: rotate(500deg);
                transform: translateX(20px) ;
            }
            100%{
                 transform: rotate(600deg);
                 transform: translateX(20px) ;
            }
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="box">
           box
        </div>
        <div class="box1">

        </div>
    </div>
</body>
</html>
